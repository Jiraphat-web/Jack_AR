<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jack AR</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
  </style>
</head>

<body>
<a-scene
  mindar-image="imageTargetSrc: ./targets.mind;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <!-- แนะนำให้ดาวน์โหลดไฟล์ .glb มาไว้ในโฟลเดอร์เดียวกับไฟล์นี้ -->
    <a-asset-item id="model0" src="./bread_monster_model.glb"></a-asset-item>

    <!-- ถ้ามีหลาย target ให้เพิ่มโมเดลตรงนี้ เช่น
    <a-asset-item id="model1" src="./model1.glb"></a-asset-item>
    -->
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- Target 1 (รูปลำดับที่ 0 ในไฟล์ targets.mind) -->
  <a-entity mindar-image-target="targetIndex: 0">
    <a-gltf-model
      src="#model0"
      animation-mixer
      rotation="90 0 0"
      scale="2 2 2"
      position="0 0 0">
    </a-gltf-model>
  </a-entity>

  <!-- Target 2: เปิดใช้เมื่อมี model1 ใน a-assets และมีรูปที่ 2 ใน targets.mind
  <a-entity mindar-image-target="targetIndex: 1">
    <a-gltf-model src="#model1" animation-mixer scale="1 1 1"></a-gltf-model>
  </a-entity>
  -->
</a-scene>
</body>
</html>

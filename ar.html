<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>View AR</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script><script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script><style>body{margin:0;font-family:Rajdhani,sans-serif;background:#030914;color:#fff}.ui{position:fixed;z-index:10;top:18px;left:50%;transform:translateX(-50%);width:min(900px,calc(100% - 28px));display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 15px;background:#061327d9;border:1px solid #e8bd6355;backdrop-filter:blur(14px);box-shadow:0 15px 45px #0008}.brand{font-family:Cinzel;color:#fff0b5;letter-spacing:2px}.brand span{color:#e8bd63}.btn{display:inline-block;text-decoration:none;color:#08101d;background:linear-gradient(135deg,#9c702d,#e8bd63,#fff0b5);padding:9px 15px;font-weight:700;letter-spacing:1px}.hint{position:fixed;z-index:10;left:50%;bottom:22px;transform:translateX(-50%);text-align:center;width:min(560px,calc(100% - 30px));padding:14px;background:#061327e8;border:1px solid #e8bd6355}.hint b{font-family:Cinzel;color:#fff0b5}.hint img{width:70px;display:block;margin:8px auto 0;background:#fff;padding:4px}.spark{position:fixed;pointer-events:none;z-index:9999;color:#fff0b5;text-shadow:0 0 10px #fff0a6;font-size:14px;animation:spark .8s ease-out forwards}@keyframes spark{to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.3) rotate(45deg);opacity:0}}@media(max-width:600px){.ui{top:10px}.brand{font-size:12px}.btn{font-size:12px}.hint{font-size:13px}}</style></head><body>
<a-scene embedded vr-mode-ui="enabled:false" renderer="logarithmicDepthBuffer:true; colorManagement:true" arjs="sourceType:webcam; facingMode:environment; debugUIEnabled:false">
  <a-assets><a-asset-item id="epona" src="https://sibsansuk.github.io/epona.glb"></a-asset-item></a-assets>
  <a-marker preset="hiro" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="5">
    <a-entity gltf-model="#epona" scale="0.5 0.5 0.5" position="0 0 0" rotation="0 0 0" animation-mixer="loop:repeat"></a-entity>
    <a-light type="ambient" intensity="1.8"></a-light>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>
<script>document.addEventListener('click',e=>{for(let i=0;i<9;i++){const s=document.createElement('span');s.className='spark';s.textContent=['✦','✧','⋆','·'][Math.floor(Math.random()*4)];s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';const a=Math.random()*Math.PI*2,r=20+Math.random()*55;s.style.setProperty('--x',Math.cos(a)*r+'px');s.style.setProperty('--y',Math.sin(a)*r+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),850)}});</script></body></html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MindAR Multi Target</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
<style>
  body { margin: 0; overflow: hidden; }
</style>
</head>
<body>
<a-scene
  mindar-image="imageTargetSrc: https://jiraphat-web.github.io/Jack_AR/targets-3.mind; maxTrack: 3;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets timeout="30000">
    <a-asset-item id="model0" src="https://cdn.jsdelivr.net/gh/phatcharin7338-web/View_AR@main/monster_hunter.glb"></a-asset-item>
    <a-asset-item id="model1" src="https://cdn.jsdelivr.net/gh/Smiling24-mm/ar-smiling-chat@main/assets/DamagedHelmet.glb"></a-asset-item>
    <a-asset-item id="model2" src="https://ifyourporchor-hash.github.io/puni12.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- Target 1 -->
  <a-entity mindar-image-target="targetIndex: 0">
    <a-gltf-model src="#model0" animation-mixer rotation="0 0 0" scale="0.3 0.3 0.3"></a-gltf-model>
  </a-entity>

  <!-- Target 2 -->
  <a-entity mindar-image-target="targetIndex: 1">
    <a-gltf-model src="#model1" animation-mixer rotation="90 0 0" scale="0.3 0.3 0.3"></a-gltf-model>
  </a-entity>

  <!-- Target 3 -->
  <a-entity mindar-image-target="targetIndex: 2">
    <a-gltf-model src="#model2" animation-mixer rotation="0 0 0" scale="0.3 0.3 0.3"></a-gltf-model>
  </a-entity>
</a-scene>
</body>
</html>

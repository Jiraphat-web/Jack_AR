<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini AR Face - pepo</title>
<style>
  :root { --bg:#101114; --fg:#f2f2f2; --accent:#ffb84d; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, "Noto Sans Thai", sans-serif; }
  body { display:flex; align-items:center; justify-content:center; overflow:hidden; }
  #stage { position:relative; width:100%; max-height:100%; background:#000; }
  #stage video, #stage canvas { position:absolute; inset:0; width:100%; height:100%;
    transform: scaleX(-1); /* กระจกเงา */ }
  #status { position:fixed; left:50%; bottom:20px; transform:translateX(-50%);
    padding:8px 14px; border-radius:999px; background:rgba(0,0,0,.65);
    font-size:14px; max-width:92vw; text-align:center; }
  #status.hide { display:none; }
  #status.err { background:#7a1f1f; }
  #start { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--bg); z-index:5; }
  #start button { font:inherit; font-size:18px; padding:14px 28px; border:0; border-radius:12px;
    background:var(--accent); color:#1a1200; cursor:pointer; }
  #start button:focus-visible { outline:3px solid #fff; outline-offset:3px; }
</style>
</head>
<body>

<div id="start"><button id="startBtn">เปิดกล้อง</button></div>

<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="gl"></canvas>
</div>
<div id="status">รอเริ่มต้น…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { FaceLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

/* ====== ตั้งค่า ====== */
const MODEL_URL   = "pepo.glb";   // ไฟล์โมเดล (วางไว้โฟลเดอร์เดียวกับไฟล์นี้)
const HEAD_SIZE = 48;             // ขนาดโมเดลเต็มหัวเป็น cm (ปรับเพิ่ม/ลดได้ เช่น 18-30)
const OFFSET      = new THREE.Vector3(0, 0, 0); // ขยับโมเดลเทียบกับหน้า (x,y,z)
/* ==================== */

const video  = document.getElementById("video");
const canvas = document.getElementById("gl");
const stage  = document.getElementById("stage");
const statusEl = document.getElementById("status");

const setStatus = (t, err=false) => {
  statusEl.textContent = t;
  statusEl.className = err ? "err" : "";
};

/* ---------- Three.js ---------- */
const renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(63, 1, 1, 1000);
scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 1.6));
const dir = new THREE.DirectionalLight(0xffffff, 1.4);
dir.position.set(0, 1, 2);
scene.add(dir);

// faceGroup ตามตำแหน่ง/การหมุนของหน้า, modelPivot ใช้ปรับขนาดและ offset
const faceGroup = new THREE.Group();
faceGroup.matrixAutoUpdate = false;
faceGroup.visible = false;
scene.add(faceGroup);

const morphMeshes = [];   // mesh ที่มี morph targets (blendshape)

function loadModel() {
  return new Promise((resolve, reject) => {
    new GLTFLoader().load(MODEL_URL, (gltf) => {
      const model = gltf.scene;

      // จัดโมเดลให้อยู่กลางและปรับขนาดอัตโนมัติ
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const s = HEAD_SIZE / (Math.max(size.x, size.y) || 1);
      model.scale.setScalar(s);
      model.position.copy(center).multiplyScalar(-s).add(OFFSET);

      model.traverse((o) => {
        if (o.isMesh && o.morphTargetDictionary && o.morphTargetInfluences) {
          morphMeshes.push(o);
        }
      });
      faceGroup.add(model);
      console.log("morph meshes:", morphMeshes.map(m => m.name),
                  "targets:", morphMeshes[0] && Object.keys(morphMeshes[0].morphTargetDictionary));
      resolve();
    }, undefined, reject);
  });
}

/* ---------- MediaPipe ---------- */
let landmarker;
async function createLandmarker() {
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  landmarker = await FaceLandmarker.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numFaces: 1,
    outputFaceBlendshapes: true,
    outputFacialTransformationMatrixes: true
  });
}

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  });
  video.srcObject = stream;
  await new Promise(r => video.onloadedmetadata = r);
  await video.play();

  const w = video.videoWidth, h = video.videoHeight;
  stage.style.aspectRatio = `${w} / ${h}`;
  stage.style.maxWidth = `calc(100vh * ${w} / ${h})`;
  renderer.setSize(stage.clientWidth, stage.clientHeight, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

addEventListener("resize", () => {
  if (!video.videoWidth) return;
  renderer.setSize(stage.clientWidth, stage.clientHeight, false);
});

/* ---------- Loop ---------- */
let lastTime = -1;
function tick() {
  requestAnimationFrame(tick);
  if (video.readyState >= 2 && video.currentTime !== lastTime) {
    lastTime = video.currentTime;
    const res = landmarker.detectForVideo(video, performance.now());

    if (res.facialTransformationMatrixes?.length) {
      faceGroup.matrix.fromArray(res.facialTransformationMatrixes[0].data);
      faceGroup.visible = true;
    } else {
      faceGroup.visible = false;
    }

    // ส่งค่า blendshape ไปที่ morph target ชื่อเดียวกัน (ชื่อแบบ ARKit)
    const shapes = res.faceBlendshapes?.[0]?.categories;
    if (shapes) {
      for (const mesh of morphMeshes) {
        const dict = mesh.morphTargetDictionary;
        for (const c of shapes) {
          const i = dict[c.categoryName];
          if (i !== undefined) mesh.morphTargetInfluences[i] = c.score;
        }
      }
    }
  }
  renderer.render(scene, camera);
}

/* ---------- เริ่มทำงาน ---------- */
document.getElementById("startBtn").addEventListener("click", async () => {
  document.getElementById("start").remove();
  try {
    setStatus("กำลังโหลดโมเดล pepo.glb…");
    await loadModel();
    setStatus("กำลังโหลดตัวตรวจจับใบหน้า…");
    await createLandmarker();
    setStatus("กำลังเปิดกล้อง…");
    await startCamera();
    setStatus(morphMeshes.length
      ? "พร้อมแล้ว: หันหน้าเข้ากล้อง"
      : "โมเดลไม่มี blendshape จะหมุนตามหน้าอย่างเดียว");
    setTimeout(() => statusEl.classList.add("hide"), 3000);
    tick();
  } catch (e) {
    console.error(e);
    setStatus("ผิดพลาด: " + (e.message || e), true);
  }
});
</script>
</body>
</html>
